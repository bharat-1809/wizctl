name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib bin test example

      - name: Analyze
        run: dart analyze --fatal-infos lib bin test example

      # Every test runs offline against a loopback fake bulb, so no network
      # access or hardware is required. See AGENTS.md.
      - name: Run tests
        run: dart test

      - name: Validate package
        run: dart pub publish --dry-run
